        playVideo(Number(card.dataset.index), scene?.dataset.miniSeek !== undefined ? Number(scene.dataset.miniSeek) : 0, scene && scene.dataset.miniSeek === undefined ? Number(scene.dataset.miniRatio) : null);
        if (scene) requestAnimationFrame(() => elements.playerPane.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      });
      elements.grid.addEventListener('keydown', (event) => {
        const scene = event.target.closest('[data-mini-seek], [data-mini-ratio]');
        if (scene && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          event.stopPropagation();
          scene.click();
        }
      });
      elements.grid.addEventListener('pointerover', (event) => {
        const card = event.target.closest('.card');
        if (!card || card.contains(event.relatedTarget)) return;
        schedulePreview(card, Number(card.dataset.index));
      });
      elements.grid.addEventListener('pointerout', (event) => {
        const card = event.target.closest('.card');
        if (!card || card.contains(event.relatedTarget)) return;
        stopPreview();
      });
      elements.closePlayer.addEventListener('click', closePlayer);
      elements.modeToggle.addEventListener('click', togglePlayerMode);
      elements.sceneStrip.addEventListener('click', (event) => {
        const scene = event.target.closest('[data-seek]');
        if (!scene) return;
        const time = Number(scene.dataset.seek);
        if (!Number.isFinite(time)) return;
        elements.player.currentTime = time;
        elements.player.play().catch(() => {});
        elements.playerPane.scrollTo({ top: 0, behavior: 'smooth' });
        requestAnimationFrame(() => elements.playerPane.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      });
      const videoStage = $('#videoStage');
      const loopToggle = $('#loopToggle');
      let controlsTimer = null;
      function revealPlayerControls() {
        clearTimeout(controlsTimer);
        videoStage.classList.remove('controls-hidden');
        if (elements.player.paused || elements.player.ended || elements.playerPane.hidden) return;
        controlsTimer = setTimeout(() => {
          if (videoStage.querySelector('button:hover, button:focus-visible')) {
            revealPlayerControls();
            return;
          }
          videoStage.classList.add('controls-hidden');
        }, 1500);
      }
      for (const event of ['pointerenter', 'pointermove', 'pointerdown', 'focusin', 'keydown']) {
        videoStage.addEventListener(event, revealPlayerControls);
      }
      videoStage.addEventListener('pointerleave', (event) => {
        if (event.pointerType === 'touch') return;
        clearTimeout(controlsTimer);
        controlsTimer = null;
        videoStage.classList.add('controls-hidden');
      });
      for (const event of ['play', 'pause', 'ended', 'emptied']) {
        elements.player.addEventListener(event, revealPlayerControls);
      }
      function updateLoopButton() {
        const enabled = elements.player.loop;
        loopToggle.setAttribute('aria-pressed', String(enabled));
        loopToggle.setAttribute('aria-label', `ループ再生を${enabled ? 'オフ' : 'オン'}にする`);
        loopToggle.title = `ループ再生：${enabled ? 'オン' : 'オフ'}`;
      }
      try { elements.player.loop = localStorage.getItem('localflix.loop') === 'true'; } catch (_) {}
      updateLoopButton();
      loopToggle.addEventListener('click', () => {
        elements.player.loop = !elements.player.loop;
        try { localStorage.setItem('localflix.loop', String(elements.player.loop)); } catch (_) {}
        updateLoopButton();
        revealPlayerControls();
      });
      elements.player.addEventListener('error', () => {
        elements.playerError.classList.add('show');
        clearTimeout(controlsTimer);
        videoStage.classList.remove('controls-hidden');
      });
      window.addEventListener('beforeunload', () => {
        stopPreview();
        closePlayer();
        for (const url of thumbUrls) URL.revokeObjectURL(url);
      });

      applyPlayerMode();
      restoreFolders();
    })();
  </script>
</body>
</html>

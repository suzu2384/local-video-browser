        miniSceneObserver?.disconnect();
        for (const url of thumbUrls) URL.revokeObjectURL(url);
        thumbUrls.clear();
        directorySources = [];
        allVideos = [];
        displayedVideos = [];
        elements.grid.innerHTML = '';
        elements.search.value = '';
        $('#folderFilter').replaceChildren(new Option('すべてのフォルダ', ''));
        $('#durationStatus').textContent = '';
        setLibrarySummary('');
        elements.toolbar.hidden = true;
        setBusy(false);
        showNotice();
      }

      function setFolderHash(hash, replace) {
        const url = new URL(location.href);
        url.hash = hash;
        appliedHash = url.hash;
        if (location.hash === url.hash) return;
        try { history[replace ? 'replaceState' : 'pushState'](null, '', url.href); }
        catch (_) { if (replace) location.replace(url.href); else location.hash = url.hash; }
      }

      async function compactFolderHash(folders, tags, revision, expectedHash) {
        try {
          const hash = await ListUrlCodec.encodeHash(folders, tags);
          // Compression must not overwrite a newer edit, back/forward, or another URL.
          if (revision !== urlRevision || location.hash !== expectedHash) return;
          setFolderHash(hash, true);
        } catch (_) { /* The current URL remains usable if compaction fails. */ }
      }

      function writeFolderHash(token, replace = false) {
        const folders = token === null ? null : FolderUrlCodec.decode(token);
        const tags = [...tagTypes];
        const revision = ++urlRevision;
        // Publish a complete URL immediately, then replace that same history entry.
        setFolderHash(ListUrlCodec.legacyHash(folders, tags), replace);
        void compactFolderHash(folders, tags, revision, location.hash);
      }

      async function rememberViewRoot(token, root) {
        if (!root) return '';
        try { await dbPut('settings', `folderView:${token}`, root); return ''; }
        catch (_) { return 'この環境では基準フォルダを記憶できません。次回は選び直してください。'; }
      }

      async function activateTargets(paths, root) {
        const folders = FolderUrlCodec.normalize(paths);
        const token = FolderUrlCodec.encode(folders);
        resetFolderView();
        const epoch = viewEpoch;
        folderView = { folders, token };
        folderStateInitialized = true;
        viewRoot = root;
        urlError = false;
        renderTagTypes();
        viewStorageWarning = '';
        writeFolderHash(token);
        updateSourceDisplay();
        setBusy(true);
        const warning = await rememberViewRoot(token, root);
        if (epoch !== viewEpoch) return;
        viewStorageWarning = warning;
        await scanSources(false);
      }

      async function chooseBaseFolder() {
        if (folderBusy) return;
        if (!('showDirectoryPicker' in window)) {
          showNotice('URLの一覧を復元するには、フォルダ参照に対応したPC版Chrome / Edgeで開いてください。');
          return;
        }
        const epoch = viewEpoch;
        try {
          const handle = await window.showDirectoryPicker({ mode: 'read', startIn: viewRoot?.handle || 'videos' });
          if (epoch !== viewEpoch) return;
          let paths = folderView ? folderView.folders : [];
          if (!folderView && directorySources.length) {
            paths = [];
            for (const source of directorySources) {
              const parts = source.handle ? await handle.resolve(source.handle) : null;
              if (epoch !== viewEpoch) return;
              if (parts === null) {
                showNotice('既存の全対象フォルダを含む親フォルダを選んでください。別の場所のフォルダは、別一覧に分けてください。現在の登録は変更していません。');
                return;
              }
              paths.push(parts.join('/') || '.');
            }
          }
          let cacheId = crypto.randomUUID();
          if (viewRoot && await handle.isSameEntry(viewRoot.handle)) cacheId = viewRoot.cacheId;
          if (epoch !== viewEpoch) return;
          await activateTargets(paths, { handle, name: handle.name, cacheId });
        } catch (error) {
          if (epoch === viewEpoch && error?.name !== 'AbortError') showNotice('基準フォルダを選択できませんでした。フォルダへのアクセスを確認して、もう一度お試しください。');
        }
      }

      async function chooseFolder() {
        if (folderBusy || urlError) return;
        if (!('showDirectoryPicker' in window) && !folderView) return chooseLegacyFolder();
        if (!folderView || !viewRoot) return chooseBaseFolder();
        const epoch = viewEpoch;
        const root = viewRoot;
        try {
          const handle = await window.showDirectoryPicker({ mode: 'read', startIn: root.handle });
          if (epoch !== viewEpoch) return;
          const parts = await root.handle.resolve(handle);
          if (epoch !== viewEpoch) return;
          if (parts === null) { showViewHint('選択したフォルダは基準フォルダの外です。基準フォルダ内を選んでください。'); return; }
          const path = parts.join('/') || '.';
          if (folderView.folders.includes(path)) { showNotice(`「${path}」はすでに対象に含まれています。`); return; }
          await activateTargets([...folderView.folders, path], root);
        } catch (error) {
          if (epoch === viewEpoch && error?.name !== 'AbortError') showViewHint('対象フォルダを追加できませんでした。「アクセスを許可・更新」か「基準フォルダを選択」で確認してください。');
        }
      }

      async function scanUrlSources(requestPermissions) {
        durationSortGeneration += 1;
        clearTimeout(durationOrderTimer);
        durationOrderTimer = null;
        $('#durationStatus').textContent = '';
        durationFailures.clear();
        const epoch = viewEpoch;
        const scan = ++scanSequence;
        const view = folderView;
        const root = viewRoot;
        const current = () => epoch === viewEpoch && scan === scanSequence;
        setBusy(true, '動画を検索しています…');
        const sources = view.folders.map(path => ({
          id: `${root?.cacheId || 'unbound'}:${path}`, name: path, relativeRoot: path,
          kind: 'handle', handle: null, pending: true, scanEpoch: epoch
        }));
        directorySources = sources;
        const missing = [];
        let permission = 'prompt';
        try {
          if (root) permission = requestPermissions
            ? await root.handle.requestPermission({ mode: 'read' })
            : await root.handle.queryPermission({ mode: 'read' });
          if (!current()) return;
          if (permission === 'granted') {
            for (const source of sources) {
              try {
                source.handle = await FolderUrlCodec.resolve(root.handle, source.relativeRoot);
                source.pending = false;
              } catch (error) {
                source.pending = error?.name !== 'NotFoundError' && error?.name !== 'TypeMismatchError';
                missing.push(source.name);
              }
              if (!current()) return;
            }
          }
          const videos = [];
          if (permission === 'granted') for (const source of sources) {
            if (!source.handle) continue;
            try { videos.push(...await walkDirectory(source.handle, source)); }
            catch (_) { source.pending = true; missing.push(source.name); }
            if (!current()) return;
          }
          if (!current()) return;
          allVideos = videos;
          updateSourceDisplay();
          finishScan();
          if (!root) showViewHint('この一覧の基準フォルダを選択してください。下記の相対パスが入っているフォルダです。');
          else if (permission !== 'granted') showViewHint(`基準フォルダ「${root.name}」へのアクセス許可が必要です。「アクセスを許可・更新」を押してください。`);
          else if (missing.length) showViewHint(`基準フォルダ「${root.name}」内で次の対象を読み込めませんでした：${missing.join('、')}。フォルダ構成を確認するか、基準フォルダを選び直してください。`);
          else if (!view.folders.length) showViewHint(`基準フォルダ「${root.name}」を設定しました。「フォルダを追加」で、その中の収集対象を選んでください。基準フォルダ自体も選べます。`);
          else { $('#sourceMenu').open = false; showNotice(viewStorageWarning); }
        } catch (_) {
          if (current()) { allVideos = []; updateSourceDisplay(); finishScan(); showViewHint('基準フォルダを読み込めませんでした。選び直してください。'); }
        } finally { if (current()) setBusy(false); }
      }

      async function persistHandles() {
        if (folderView || urlError) return;
        const handles = directorySources
          .filter((source) => source.kind === 'handle')
          .map((source) => ({ id: source.id, name: source.name, handle: source.handle }));
        try { await dbPut('settings', 'directoryHandles', handles); } catch (_) {}
      }

      async function walkDirectory(handle, source, prefix = '') {
        const videos = [];
        for await (const entry of handle.values()) {
          if (source.scanEpoch !== undefined && source.scanEpoch !== viewEpoch) throw new Error('view changed');
          if (entry.kind === 'directory') {
            videos.push(...await walkDirectory(entry, source, `${prefix}${entry.name}/`));
          } else if (entry.kind === 'file' && isVideo(entry.name)) {
            try {
              const file = await entry.getFile();
              videos.push({
                name: entry.name,
                path: `${source.name}/${prefix}${entry.name}`,
                relativePath: `${prefix}${entry.name}`,
                sourceId: source.id,
                file,
                handle: entry
              });
            } catch (_) {}
          }
        }
        return videos;
      }

      async function scanSources(requestPermissions = false) {
        if (urlError) return;
        if (folderView) {
          if (requestPermissions && !viewRoot) return chooseBaseFolder();
          return scanUrlSources(requestPermissions);
        }
        const epoch = viewEpoch;
        const scan = ++scanSequence;
        durationSortGeneration += 1;
        $('#durationStatus').textContent = '';
        durationFailures.clear();
        if (!directorySources.length) {
          allVideos = [];
          updateSourceDisplay();
          updateFolderFilter();
          elements.toolbar.hidden = true;
          setLibrarySummary('');
          elements.grid.innerHTML = '';
          if (currentVideoKey) closePlayer();
          return;
        }
        setBusy(true, '動画を検索しています…');
        const unavailable = [];
        try {
          const scans = directorySources.map(async (source) => {
            if (source.kind === 'fallback') return source.videos;
            try {
              let permission = await source.handle.queryPermission({ mode: 'read' });
              if (permission !== 'granted' && requestPermissions) {
                permission = await source.handle.requestPermission({ mode: 'read' });
              }
              if (epoch !== viewEpoch || scan !== scanSequence) return [];
              source.pending = permission !== 'granted';
              if (source.pending) {
                setHeaderCollapsed(false);
                unavailable.push(source.name);
                return [];
              }
              return await walkDirectory(source.handle, source);
            } catch (_) {
              if (epoch !== viewEpoch || scan !== scanSequence) return [];
              source.pending = true;
              setHeaderCollapsed(false);
              unavailable.push(source.name);
              return [];
            }
          });
          const videos = (await Promise.all(scans)).flat();
          if (epoch !== viewEpoch || scan !== scanSequence) return;
          allVideos = videos;
          updateSourceDisplay();
          finishScan();
          if (!unavailable.length) $('#sourceMenu').open = false;
          const hasTemporarySource = directorySources.some((source) => source.kind === 'fallback');
          showNotice(unavailable.length
            ? `アクセス許可が必要なフォルダがあります：${unavailable.join('、')}。「↻」を押して再許可してください。`
            : hasTemporarySource
              ? 'このブラウザでは追加したフォルダを記憶できないため、次回起動時はもう一度選択してください。'
              : '');
        } finally {
          if (epoch === viewEpoch && scan === scanSequence) setBusy(false);
        }
      }

      function scanFallbackFiles(fileList) {
        if (folderView || urlError) return;
        const files = [...fileList];
        const firstPath = files[0]?.webkitRelativePath || '';
        const name = firstPath.split('/')[0] || '選択した動画';
        const id = `fallback-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const videos = files.filter((file) => isVideo(file.name)).map((file) => ({
          name: file.name,
          path: file.webkitRelativePath || file.name,
          relativePath: (file.webkitRelativePath || file.name).replace(`${name}/`, ''),
          sourceId: id,
          file
        }));
        directorySources.push({ id, name, kind: 'fallback', videos, pending: false });
        showNotice('このブラウザでは追加したフォルダを記憶できないため、次回起動時はもう一度選択してください。');
        scanSources(false);
      }

      function updateSourceDisplay() {
        const count = folderView ? folderView.folders.length : directorySources.length;
        elements.folderName.textContent = count === 0
          ? (folderView ? '対象フォルダ未選択' : '動画フォルダ未選択')
          : count === 1 ? (folderView ? folderView.folders[0] : directorySources[0].name) : `${count}個のフォルダを対象`;
        elements.folderName.title = folderView ? viewPathsText() : directorySources.map(source => source.name).join('、');
        const emptyUrl = `#folders=${FolderUrlCodec.encode([])}`;
        const setup = `<div class="source-setup">
          <p>${folderView ? `基準フォルダ：${escapeHtml(viewRoot?.name || '未選択')}<br>対象は下記の相対パスです。「.」は基準フォルダ全体です。` : '対象をURLに保存するには、登録フォルダを含む基準フォルダを選択してください。'}</p>
          <div class="source-actions">
            <button class="button" type="button" data-view-action="base">${viewRoot ? '基準フォルダを変更' : '基準フォルダを選択'}</button>
            ${folderView && viewRoot ? '<button class="button" type="button" data-view-action="rescan">アクセスを許可・更新</button>' : ''}
            <a class="button" href="${emptyUrl}" target="_blank" rel="noopener">別の一覧を開く</a>
          </div></div>`;
        elements.sources.innerHTML = setup + directorySources.map((source) => `
          <span class="source-chip${source.pending ? ' pending' : ''}" title="${source.pending ? 'アクセス許可・基準フォルダの確認が必要です' : '検索対象'}">
            <span>📁 ${escapeHtml(source.name)}${source.pending ? ' ⚠' : ''}</span>
            <button class="remove-source" type="button" data-remove-source="${escapeHtml(source.id)}" aria-label="${escapeHtml(source.name)}を解除">✕</button>
          </span>`).join('');
        elements.sources.querySelectorAll('button').forEach(button => { button.disabled = folderBusy; });
      }

      async function removeSource(id) {
        if (folderBusy) return;
        if (folderView) {
          const source = directorySources.find(source => source.id === id);
          if (source) await activateTargets(folderView.folders.filter(path => path !== source.relativeRoot), viewRoot);
          return;
        }
        directorySources = directorySources.filter((source) => source.id !== id);
        await persistHandles();
        await scanSources(false);
      }

      function finishScan() {
        updateFolderFilter();
        elements.toolbar.hidden = false;
        elements.rescanButton.disabled = !folderView && !directorySources.length;
        updateSort();
        preloadDurations();
      }

      async function durationForSort(item) {
        const key = videoKey(item);
        if (durationCache.has(key)) return;
        try {
          let duration;
          try { duration = await dbGet('settings', `duration:${key}`); } catch (_) {}
          if (!Number.isFinite(duration) || duration < 0) {
            let cached;
            try { cached = await dbGet('thumbnails', key); } catch (_) {}
            duration = cached?.duration;
          }
          if (!Number.isFinite(duration) || duration < 0) duration = await readDuration(item.file);
          if (!Number.isFinite(duration) || duration < 0) throw new Error('duration unavailable');
          rememberDuration(key, duration);
          dbPut('settings', `duration:${key}`, duration).catch(() => {});
        } catch (_) {
          durationFailures.add(key);
        }
      }

      function updateSort() {
        render();
      }

      async function preloadDurations() {
        const generation = ++durationSortGeneration;
        const status = $('#durationStatus');
        status.textContent = '';
        const pending = allVideos.filter((item) => !durationCache.has(videoKey(item)) && !durationFailures.has(videoKey(item)));
        let next = 0;
        let done = 0;
        const showProgress = () => { status.textContent = `時間を取得中 ${done}/${pending.length}`; };
        if (pending.length) showProgress();
        // Limit metadata reads; scanning every file at once can overwhelm the browser.
        await Promise.all(Array.from({ length: Math.min(3, pending.length) }, async () => {
          while (generation === durationSortGeneration && next < pending.length) {
            await durationForSort(pending[next++]);
            done += 1;
            if (generation === durationSortGeneration) showProgress();
          }
        }));
        if (generation !== durationSortGeneration) return;
        reorderDurationCards();
        const unknown = allVideos.filter((item) => !durationCache.has(videoKey(item))).length;
        status.textContent = unknown ? `時間不明 ${unknown}本` : '';
      }

      function rememberDuration(key, duration) {
        if (!Number.isFinite(duration) || duration < 0) return;
        const changed = durationCache.get(key) !== duration;
        durationCache.set(key, duration);
        durationFailures.delete(key);
        if (changed && elements.sort.value === 'duration' && durationOrderTimer === null) {
          durationOrderTimer = setTimeout(() => {
            durationOrderTimer = null;
            reorderDurationCards();
          }, 200);
        }
      }

      function reorderDurationCards() {
        if (elements.sort.value !== 'duration') return;
        const previous = displayedVideos;
        const sorted = sortVideos([...previous]);
        const cards = [...elements.grid.querySelectorAll('.card')];
        const cardByItem = new Map(cards.map((card) => [previous[Number(card.dataset.index)], card]));
        // Move existing cards to preserve loaded images and pending extraction tasks.
        if (sorted.some((item, index) => item !== previous[index])) stopPreview();
        displayedVideos = sorted;
        sorted.forEach((item, index) => {
          const card = cardByItem.get(item);
          if (!card) return;
          card.dataset.index = String(index);
          const thumb = card.querySelector('[data-thumb-index]');
          const scenes = card.querySelector('[data-mini-scene-index]');
          if (thumb) thumb.dataset.thumbIndex = String(index);
          if (scenes) scenes.dataset.miniSceneIndex = String(index);
          const duration = durationCache.get(videoKey(item));
          if (Number.isFinite(duration)) card.querySelector('.duration-badge').textContent = formatTime(duration);
          if (elements.grid.children[index] !== card) {
            elements.grid.insertBefore(card, elements.grid.children[index] || null);
          }
        });
      }

      function localDayKey(date = new Date()) {
        return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
      }

      function recommendationKey(item) {
        // Folder IDs can change when folders are reselected; use file identity instead.
        return JSON.stringify([item.path, item.file.size, item.file.lastModified]);
      }

      function dailyScore(day, key) {
        const text = `${day}|${key}`;
        let hash = 2166136261;
        for (let i = 0; i < text.length; i += 1) {
          hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
        }
        hash = Math.imul(hash ^ (hash >>> 16), 0x85ebca6b);
        hash = Math.imul(hash ^ (hash >>> 13), 0xc2b2ae35);
        return (hash ^ (hash >>> 16)) >>> 0;
      }

      let recommendationDay = localDayKey();

      function sortVideos(items) {
        const collator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });
        const mode = elements.sort.value;
        const direction = sortDescending ? -1 : 1;
        const compareNames = (a, b) => collator.compare(a.path, b.path)
          || (recommendationKey(a) < recommendationKey(b) ? -1 : recommendationKey(a) > recommendationKey(b) ? 1 : 0);
        recommendationDay = localDayKey();
        if (mode === 'recommended') {
          return items.map((item) => {
            const key = recommendationKey(item);
            return { item, key, score: dailyScore(recommendationDay, key) };
          }).sort((a, b) => direction * (a.score - b.score || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0)))
            .map(({ item }) => item);
        }
        return items.sort((a, b) => {
          if (mode === 'modified') return direction * (a.file.lastModified - b.file.lastModified || compareNames(a, b));
          if (mode === 'duration') {
            const aTime = durationCache.get(videoKey(a));
            const bTime = durationCache.get(videoKey(b));
            const aKnown = Number.isFinite(aTime);
            const bKnown = Number.isFinite(bTime);
            if (aKnown !== bKnown) return aKnown ? -1 : 1;
            if (aKnown && aTime !== bTime) return direction * (aTime - bTime);
          }
          return direction * compareNames(a, b);
        });
      }

      function updateFolderFilter() {
        const filter = $('#folderFilter');
        const selected = filter.value;
        // Only registered collection roots are selectable; their descendants share sourceId.
        const folders = new Map(directorySources.map((source) => [source.id, source.name]));
        filter.replaceChildren(new Option('すべてのフォルダ', ''));
        for (const [key, label] of [...folders].sort((a, b) => a[1].localeCompare(b[1], 'ja', { numeric: true }))) {
          filter.add(new Option(label, key));
        }
        filter.value = folders.has(selected) ? selected : '';
      }

      function render() {
        stopPreview();
        if (observer) observer.disconnect();
        if (miniSceneObserver) miniSceneObserver.disconnect();
        miniSceneRenderId += 1;
        const renderId = miniSceneRenderId;
        miniSceneQueue = [];
        for (const url of thumbUrls) URL.revokeObjectURL(url);
        thumbUrls.clear();

        displayedVideos = sortVideos(allVideos.filter(matchesVideoFilters));
        elements.grid.innerHTML = displayedVideos.map((video, index) => {
          const selected = videoKey(video) === currentVideoKey;
          return `
            <div class="card${selected ? ' selected' : ''}" role="group" data-index="${index}" title="${escapeHtml(video.path)}" aria-label="${escapeHtml(video.name)}">
              <button class="poster" type="button" style="--h:${hueFor(video.path)}" aria-label="${escapeHtml(video.name)}を再生" aria-pressed="${selected}">
                <div class="fallback-art"></div>
                <img class="thumb" alt="" data-thumb-index="${index}">
                <video class="preview-video" muted loop playsinline preload="metadata"></video>
                <span class="play-badge">▶</span>
                <span class="duration-badge" aria-label="再生時間">${durationCache.has(videoKey(video)) ? formatTime(durationCache.get(videoKey(video))) : ''}</span>
              </button>
              <div class="card-scenes" data-mini-scene-index="${index}" data-scene-count="${miniSceneCount}" aria-label="代表シーン">
                ${miniSceneRatios(miniSceneCount).map(ratio => `<span class="card-scene loading" data-mini-ratio="${ratio}" role="button" tabindex="0" aria-label="動画の${Math.round(ratio * 100)}%から再生" title="画像を読み込み中・クリックでこの位置から再生"></span>`).join('')}
              </div>
              <div class="card-title">${escapeHtml(displayTitle(video.name))}</div>
              <div class="card-tags"><span class="video-tags-label">${escapeHtml(activeVideoTags(video).join('・'))}</span><button class="edit-video-tags" type="button" data-edit-video-tags aria-label="${escapeHtml(video.name)}のタグを編集">タグ</button></div>
            </div>`;
        }).join('');

        const totalSize = displayedVideos.reduce((sum, video) => sum + video.file.size, 0);
        setLibrarySummary(allVideos.length
          ? `${displayedVideos.length} 本${displayedVideos.length !== allVideos.length ? ` / 全 ${allVideos.length} 本` : ''} ・ ${formatBytes(totalSize)}`
          : '動画ファイルが見つかりませんでした', !allVideos.length);
        if (allVideos.length && !displayedVideos.length) {
          elements.grid.innerHTML = '<p class="tag-message" role="status">条件に一致する動画がありません。タグ・検索語・フォルダの指定を見直してください。</p>';
        }

        observer = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            observer.unobserve(entry.target);
            const index = Number(entry.target.dataset.thumbIndex);
            loadThumbnail(displayedVideos[index], entry.target);
          }
        }, { rootMargin: '350px' });
        document.querySelectorAll('[data-thumb-index]').forEach((image) => observer.observe(image));

        miniSceneObserver = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            miniSceneObserver.unobserve(entry.target);
            const index = Number(entry.target.dataset.miniSceneIndex);
            queueMiniScenes(displayedVideos[index], entry.target, renderId);
          }
        }, { rootMargin: '450px' });
        document.querySelectorAll('[data-mini-scene-index]').forEach((container) => miniSceneObserver.observe(container));
      }

      async function loadThumbnail(video, image) {
        if (!video || !image.isConnected) return;
        const cacheKey = videoKey(video);
        const durationLabel = image.closest('.poster')?.querySelector('.duration-badge');
        let cached = null;
        let blob = null;
        let duration = durationCache.get(cacheKey);
        try { cached = await dbGet('thumbnails', cacheKey); } catch (_) {}
        if (cached instanceof Blob) {
          blob = cached;
        } else if (cached?.blob instanceof Blob) {
          blob = cached.blob;
          if (Number.isFinite(cached.duration)) duration = cached.duration;
        }
        if (!blob) {
          try {
            const generated = await createThumbnail(video.file);
            blob = generated?.blob || null;
            duration = generated?.duration;
            if (blob) dbPut('thumbnails', cacheKey, { blob, duration }).catch(() => {});
          } catch (_) { return; }
        }
        if (Number.isFinite(duration) && duration >= 0) {
          rememberDuration(cacheKey, duration);
          if (durationLabel?.isConnected) durationLabel.textContent = formatTime(duration);
        } else {
          readDuration(video.file).then((loadedDuration) => {
            rememberDuration(cacheKey, loadedDuration);
            if (durationLabel?.isConnected) durationLabel.textContent = formatTime(loadedDuration);
            if (blob) dbPut('thumbnails', cacheKey, { blob, duration: loadedDuration }).catch(() => {});
          }).catch(() => {});
        }
        if (!blob || !image.isConnected) return;
        const url = URL.createObjectURL(blob);
        thumbUrls.add(url);
        image.onload = () => image.classList.add('ready');
        image.src = url;
      }

      function queueMiniScenes(item, container, renderId) {
        if (!item || !container) return;
        miniSceneQueue.push({ item, container, renderId });
        pumpMiniSceneQueue();
      }

      function pumpMiniSceneQueue() {
        while (miniSceneActive < 2 && miniSceneQueue.length) {
          const task = miniSceneQueue.shift();
          miniSceneActive += 1;
          loadMiniScenes(task.item, task.container, task.renderId)
            .catch(() => {
              if (task.renderId === miniSceneRenderId) showMiniScenes(task.container, []);
            })
            .finally(() => {
              miniSceneActive -= 1;
              pumpMiniSceneQueue();
            });
        }
      }

      function showMiniScenes(container, scenes) {
        if (!container.isConnected) return;
        container.innerHTML = '';
        const ratios = miniSceneRatios(Number(container.dataset.sceneCount));
        for (let index = 0; index < ratios.length; index += 1) {
          const scene = scenes[index];
          // Keep all frames in the layout, even when extraction or image loading fails.
          const frame = document.createElement('span');
          frame.className = 'card-scene';
          const showUnavailable = () => {
            frame.replaceChildren();

            frame.className = 'card-scene unavailable';
            frame.title = 'シーン画像なし・クリックでこの位置から再生';
          };
          frame.dataset.miniRatio = String(ratios[index]);
          if (Number.isFinite(scene?.time)) frame.dataset.miniSeek = String(scene.time);
          frame.setAttribute('role', 'button');
          frame.tabIndex = 0;
          frame.setAttribute('aria-label', Number.isFinite(scene?.time) ? `${formatTime(scene.time)}から再生` : `動画の${Math.round(ratios[index] * 100)}%から再生`);
          container.append(frame);
          if (!scene?.imageUrl) {
            showUnavailable();
            continue;
          }
          frame.dataset.miniSeek = String(scene.time);
          frame.setAttribute('role', 'button');
          frame.tabIndex = 0;
          frame.setAttribute('aria-label', `${formatTime(scene.time)}から再生`);
          const image = document.createElement('img');
          image.onerror = showUnavailable;
          image.src = scene.imageUrl;
          image.alt = `${formatTime(scene.time)}のシーン`;
          image.title = formatTime(scene.time);
          frame.append(image);
        }
      }

      async function loadMiniScenes(item, container, renderId) {
        const count = Number(container.dataset.sceneCount);
        const cacheKey = `${videoKey(item)}:count:${count}`;
        let scenes = miniSceneCache.get(cacheKey);
        if (!scenes) {
          scenes = await extractMiniScenes(item.file, count);
          if (scenes.length) {
            miniSceneCache.set(cacheKey, scenes);
            if (miniSceneCache.size > 40) miniSceneCache.delete(miniSceneCache.keys().next().value);
          }
        }
        if (renderId !== miniSceneRenderId || !container.isConnected) return;
        showMiniScenes(container, scenes);
      }

      async function extractMiniScenes(file, count) {
        const extractor = document.createElement('video');
        const url = URL.createObjectURL(file);
        extractor.muted = true;
        extractor.preload = 'auto';
        extractor.playsInline = true;
        extractor.src = url;
        const scenes = [];
        try {
          await waitForMetadata(extractor);
          if (!Number.isFinite(extractor.duration) || extractor.duration < 1) return [];
          for (const ratio of miniSceneRatios(count)) {
            const time = extractor.duration * ratio;
            const scene = { time, imageUrl: null };
            scenes.push(scene);
            try {
            await seekForScene(extractor, time);
            if (!extractor.videoWidth || !extractor.videoHeight) continue;
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 90;
            const context = canvas.getContext('2d');
            const scale = Math.max(canvas.width / extractor.videoWidth, canvas.height / extractor.videoHeight);
            const width = extractor.videoWidth * scale;
            const height = extractor.videoHeight * scale;
            context.drawImage(extractor, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
            scene.imageUrl = canvas.toDataURL('image/jpeg', .68);
            } catch (_) { /* Preserve the timestamp even if this frame fails. */ }
          }
          return scenes;
        } catch (_) {
          return [];
        } finally {
          extractor.pause();
          extractor.removeAttribute('src');
          extractor.load();
          URL.revokeObjectURL(url);
        }
      }

      function createThumbnail(file) {
        return new Promise((resolve, reject) => {
          const video = document.createElement('video');
          const url = URL.createObjectURL(file);
          let settled = false;
          const timer = setTimeout(() => finish(null, new Error('timeout')), 12000);
          let duration = null;
          const finish = (blob, error) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            video.removeAttribute('src');
            video.load();
            URL.revokeObjectURL(url);
            error ? reject(error) : resolve({ blob, duration });
          };
          video.muted = true;
          video.preload = 'metadata';
          video.playsInline = true;
          video.onerror = () => finish(null, new Error('decode error'));
          video.onloadedmetadata = () => {
            duration = Number.isFinite(video.duration) ? video.duration : null;
            const target = Number.isFinite(video.duration) && video.duration > 1
              ? Math.min(Math.max(video.duration * .12, .1), 12)
              : .1;
            try { video.currentTime = target; } catch (_) { finish(null, new Error('seek error')); }
          };
          video.onseeked = () => {
            if (!video.videoWidth || !video.videoHeight) return finish(null, new Error('no dimensions'));
            const canvas = document.createElement('canvas');
            canvas.width = 480;
            canvas.height = 270;
            const context = canvas.getContext('2d');
            const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
            const width = video.videoWidth * scale;
            const height = video.videoHeight * scale;
            context.drawImage(video, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
            canvas.toBlob((blob) => blob ? finish(blob) : finish(null, new Error('canvas error')), 'image/jpeg', .78);
          };
          video.src = url;
          video.load();
        });
      }

      function readDuration(file) {
        return new Promise((resolve, reject) => {
          const video = document.createElement('video');
          const url = URL.createObjectURL(file);
          let settled = false;
          const timer = setTimeout(() => finish(null, new Error('metadata timeout')), 10000);
          const finish = (duration, error) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            video.removeAttribute('src');
            video.load();
            URL.revokeObjectURL(url);
            error ? reject(error) : resolve(duration);
          };
          video.preload = 'metadata';
          video.onloadedmetadata = () => Number.isFinite(video.duration)
            ? finish(video.duration)
            : finish(null, new Error('duration unavailable'));
          video.onerror = () => finish(null, new Error('decode error'));
          video.src = url;
          video.load();
        });
      }

      const splitHandle = $('#splitHandle');
      let splitRatio = 1.35 / 2.35;
      let splitPointer = null;
      let splitGrabOffset = 0;
      try {
        const saved = Number(localStorage.getItem('localflix.splitRatio'));
        if (Number.isFinite(saved) && saved > 0 && saved < 1) splitRatio = saved;
      } catch (_) {}

      function splitBounds(width, ratio) {
        const available = Math.max(0, width - 24);
        const minimum = Math.min(320, available / 2);
        return { available, minimum, maximum: available - minimum,
          player: Math.max(minimum, Math.min(available - minimum, available * ratio)) };
      }

      function updateSplitWidth() {
        if (playerMode === 'theater' || !matchMedia('(min-width: 1001px)').matches) return;
        const bounds = splitBounds(elements.contentLayout.clientWidth, splitRatio);
        elements.contentLayout.style.setProperty('--player-width', `${bounds.player}px`);
        const percent = (value) => Math.round(value / (bounds.available || 1) * 100);
        splitHandle.setAttribute('aria-valuemin', String(percent(bounds.minimum)));
        splitHandle.setAttribute('aria-valuemax', String(percent(bounds.maximum)));
        splitHandle.setAttribute('aria-valuenow', String(percent(bounds.player)));
        splitHandle.setAttribute('aria-valuetext', `再生領域 ${percent(bounds.player)}%`);
      }

      function saveSplitWidth() {
        try { localStorage.setItem('localflix.splitRatio', String(splitRatio)); } catch (_) {}
      }

      splitHandle.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        splitPointer = event.pointerId;
        splitGrabOffset = event.clientX - splitHandle.getBoundingClientRect().left;
        splitHandle.setPointerCapture(event.pointerId);
        splitHandle.focus();
        stopPreview();
        splitHandle.classList.add('dragging');
        document.body.classList.add('resizing-split');
      });
      splitHandle.addEventListener('pointermove', (event) => {
        if (event.pointerId !== splitPointer) return;
        const rect = elements.contentLayout.getBoundingClientRect();
        const bounds = splitBounds(rect.width, splitRatio);
        const width = Math.max(bounds.minimum, Math.min(bounds.maximum, event.clientX - rect.left - splitGrabOffset));
        splitRatio = width / (bounds.available || 1);
        updateSplitWidth();
      });
      function finishSplitDrag() {
        if (splitPointer === null) return;
        const pointer = splitPointer;
        splitPointer = null;
        if (splitHandle.hasPointerCapture(pointer)) splitHandle.releasePointerCapture(pointer);
        splitHandle.classList.remove('dragging');
        document.body.classList.remove('resizing-split');
        saveSplitWidth();
      }
      splitHandle.addEventListener('pointerup', finishSplitDrag);
      splitHandle.addEventListener('pointercancel', finishSplitDrag);
      splitHandle.addEventListener('lostpointercapture', finishSplitDrag);
      window.addEventListener('blur', finishSplitDrag);
      splitHandle.addEventListener('dblclick', () => {
        splitRatio = 1.35 / 2.35;
        updateSplitWidth();
        saveSplitWidth();
      });
      splitHandle.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const b = splitBounds(elements.contentLayout.clientWidth, splitRatio);
        let width = b.player + (event.key === 'ArrowLeft' ? -20 : 20);
        if (event.key === 'Home') width = b.minimum;
        if (event.key === 'End') width = b.maximum;
        splitRatio = Math.max(b.minimum, Math.min(b.maximum, width)) / (b.available || 1);
        updateSplitWidth();
        saveSplitWidth();
      });
      new ResizeObserver(updateSplitWidth).observe(elements.contentLayout);
      window.addEventListener('resize', updateSplitWidth);

      function applyPlayerMode() {
        finishSplitDrag();
        const theater = playerMode === 'theater';
        elements.contentLayout.classList.toggle('theater-mode', theater);
        elements.modeToggle.textContent = theater ? '◫ 分割モード' : '▣ シアターモード';
        elements.modeToggle.title = theater ? '左右の分割表示に戻す' : '上部固定のシアター表示にする';
        elements.modeToggle.setAttribute('aria-pressed', String(theater));
        updateSplitWidth();
      }

      function togglePlayerMode() {
        playerMode = playerMode === 'theater' ? 'split' : 'theater';
        applyPlayerMode();
        if (playerMode === 'theater') {
          requestAnimationFrame(() => elements.playerPane.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        }
      }

      function waitForMetadata(video) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('metadata timeout')), 15000);
          const cleanup = () => {
            clearTimeout(timer);
            video.removeEventListener('loadedmetadata', onLoaded);
            video.removeEventListener('error', onError);
          };
          const onLoaded = () => { cleanup(); resolve(); };
          const onError = () => { cleanup(); reject(new Error('decode error')); };
          video.addEventListener('loadedmetadata', onLoaded);
          video.addEventListener('error', onError);
          video.load();
        });
      }

      function seekForScene(video, time) {
        return new Promise((resolve, reject) => {
          let settled = false;
          const timer = setTimeout(() => finish(false), 9000);
          const finish = (success) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            video.removeEventListener('seeked', onSeeked);
            video.removeEventListener('error', onError);
            success ? resolve() : reject(new Error('seek error'));
          };
          const onSeeked = () => {
            setTimeout(() => finish(true), 80);
          };
          const onError = () => finish(false);
          video.addEventListener('seeked', onSeeked);
          video.addEventListener('error', onError);
          try { video.currentTime = time; } catch (_) { finish(false); }
        });
      }

      function appendSceneCard(time, imageUrl, existing = null) {
        const button = existing || document.createElement('button');
        button.className = imageUrl ? 'scene-card' : 'scene-card scene-placeholder';
        button.type = 'button';
        button.dataset.seek = String(time);
        button.title = `${formatTime(time)}へ移動`;
        const image = document.createElement('img');
        if (imageUrl) image.src = imageUrl;
        image.alt = `${formatTime(time)}のシーン`;
        const label = document.createElement('span');
        label.className = 'scene-time';
        label.textContent = formatTime(time);
        button.replaceChildren(...(imageUrl ? [image, label] : [label]));
        if (!existing) elements.sceneStrip.append(button);
        return button;
      }

      async function generateScenes(item) {
        const generationId = ++sceneGenerationId;
        const cacheKey = videoKey(item);
        const cachedScenes = sceneCache.get(cacheKey);
        if (cachedScenes) {
          elements.scenes.hidden = false;
          elements.sceneStrip.innerHTML = '';
          cachedScenes.forEach((scene) => appendSceneCard(scene.time, scene.imageUrl));
          elements.scenesStatus.textContent = `${cachedScenes.length}シーン`;
          return;
        }
        const knownDuration = durationCache.get(cacheKey);
        const placeholderCount = Number.isFinite(knownDuration) ? (knownDuration < 90 ? 5 : knownDuration < 900 ? 7 : 9) : 9;
        elements.scenes.hidden = false;
        elements.scenesStatus.textContent = '抽出中…';
        elements.sceneStrip.innerHTML = '<span class="scene-placeholder"></span>'.repeat(placeholderCount);

        const extractor = document.createElement('video');
        const extractionUrl = URL.createObjectURL(item.file);
        extractor.muted = true;
        extractor.preload = 'auto';
        extractor.playsInline = true;
        extractor.src = extractionUrl;

        try {
          await waitForMetadata(extractor);
          if (generationId !== sceneGenerationId) return;
          const duration = extractor.duration;
          if (!Number.isFinite(duration) || duration < 1) throw new Error('duration unavailable');
          const count = duration < 90 ? 5 : duration < 900 ? 7 : 9;
          const times = Array.from({ length: count }, (_, index) => duration * ((index + 1) / (count + 1)));
          const generatedScenes = [];
          // Allocate the complete grid once; extraction only fills existing cells.
          elements.sceneStrip.replaceChildren();
          const slots = times.map(time => appendSceneCard(time, null));

          for (const [index, time] of times.entries()) {
            if (generationId !== sceneGenerationId) return;
            await seekForScene(extractor, time);
            if (generationId !== sceneGenerationId) return;

            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 180;
            const context = canvas.getContext('2d');
            const scale = Math.max(canvas.width / extractor.videoWidth, canvas.height / extractor.videoHeight);
            const width = extractor.videoWidth * scale;
            const height = extractor.videoHeight * scale;
            context.drawImage(extractor, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);

            const imageUrl = canvas.toDataURL('image/jpeg', .76);
            generatedScenes.push({ time, imageUrl });
            appendSceneCard(time, imageUrl, slots[index]);
          }
          if (generationId === sceneGenerationId) {
            sceneCache.set(cacheKey, generatedScenes);
            if (sceneCache.size > 12) sceneCache.delete(sceneCache.keys().next().value);
            elements.scenesStatus.textContent = `${count}シーン`;
          }
        } catch (_) {
          if (generationId === sceneGenerationId) {
            elements.sceneStrip.querySelectorAll('.scene-placeholder').forEach(slot => {
              slot.classList.remove('scene-placeholder');
              slot.classList.add('scene-unavailable');
              slot.append(document.createTextNode('画像なし'));
            });
            elements.scenesStatus.textContent = '一部またはすべてのシーンを抽出できませんでした';
          }
        } finally {
          extractor.pause();
          extractor.removeAttribute('src');
          extractor.load();
          URL.revokeObjectURL(extractionUrl);
        }
      }

      function revealSelectedCard(key) {
        requestAnimationFrame(() => {
          if (currentVideoKey !== key) return;
          const card = [...elements.grid.querySelectorAll('.card')].find(node => {
            const video = displayedVideos[Number(node.dataset.index)];
            return video && videoKey(video) === key;
          });
          if (!card) return;
          const top = Math.max(0, $('#topbar').getBoundingClientRect().bottom) + 12;
          const bottom = window.innerHeight - 12;
          let bounds = card.getBoundingClientRect();
          // On a short screen, prioritize the poster over the entire card.
          if (bounds.height > bottom - top) bounds = card.querySelector('.poster').getBoundingClientRect();
          const offset = bounds.top < top || bounds.height > bottom - top
            ? bounds.top - top
            : bounds.bottom > bottom ? bounds.bottom - bottom : 0;
          if (Math.abs(offset) > 1) window.scrollBy({ top: offset, behavior: 'smooth' });
        });
      }

      function playVideo(index, startTime = 0, startRatio = null, revealCard = true) {
        const video = displayedVideos[index];
        if (!video) return;
        stopPreview();
        elements.player.pause();
        elements.player.removeAttribute('src');
        elements.player.load();
        elements.player.onloadedmetadata = null;
        if (playerUrl) URL.revokeObjectURL(playerUrl);
        playerUrl = URL.createObjectURL(video.file);
        currentVideoKey = videoKey(video);
        elements.player.src = playerUrl;
        if (startTime > 0 || startRatio !== null) {
          elements.player.onloadedmetadata = () => {
            elements.player.onloadedmetadata = null;
            const duration = elements.player.duration;
            const target = startRatio !== null && Number.isFinite(duration) ? duration * startRatio : startTime;
            elements.player.currentTime = Math.min(target, Number.isFinite(duration) ? duration : target);
          };
        }
        elements.playerTitle.textContent = displayTitle(video.name);
        elements.playerPath.textContent = `${video.path} ・ ${formatBytes(video.file.size)}`;
        elements.playerError.classList.remove('show');
        elements.playerPane.hidden = false;
        elements.playerPane.scrollTop = 0;
        elements.contentLayout.classList.add('player-open');
        applyPlayerMode();
        document.querySelectorAll('.card').forEach((card) => {
          const selected = displayedVideos[Number(card.dataset.index)] === video;
          card.classList.toggle('selected', selected);
          card.querySelector('.poster').setAttribute('aria-pressed', String(selected));
        });
        elements.player.play().catch(() => {});
        generateScenes(video);
        if (revealCard) revealSelectedCard(currentVideoKey);
      }

      function closePlayer() {
        elements.player.onloadedmetadata = null;
        elements.player.pause();
        elements.player.removeAttribute('src');
        elements.player.load();
        if (playerUrl) URL.revokeObjectURL(playerUrl);
        playerUrl = null;
        currentVideoKey = null;
        sceneGenerationId += 1;
        elements.scenes.hidden = true;
        elements.scenesStatus.textContent = '';
        elements.sceneStrip.innerHTML = '';
        elements.playerPane.hidden = true;
        elements.contentLayout.classList.remove('player-open');
        document.querySelectorAll('.card.selected').forEach((card) => {
          card.classList.remove('selected');
          card.querySelector('.poster').setAttribute('aria-pressed', 'false');
        });
      }

      function schedulePreview(card, index) {
        if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
        const item = displayedVideos[index];
        if (!item || videoKey(item) === currentVideoKey) return;
        stopPreview();
        previewTimer = setTimeout(() => startPreview(card, index), 450);
      }

      function startPreview(card, index) {
        const item = displayedVideos[index];
        const preview = card?.querySelector('.preview-video');
        if (!item || !preview || !card.isConnected) return;
        previewCard = card;
        previewUrl = URL.createObjectURL(item.file);
        preview.muted = true;
        preview.loop = true;
        preview.playsInline = true;
        preview.onloadedmetadata = () => {
          if (previewCard !== card) return;
          if (Number.isFinite(preview.duration) && preview.duration > 1) {
            try { preview.currentTime = Math.min(Math.max(preview.duration * .12, .1), 10); } catch (_) {}
          }
          preview.play().catch(() => {});
        };
        preview.onplaying = () => {
          if (previewCard === card) preview.classList.add('active');
        };
        preview.onerror = () => stopPreview();
        preview.src = previewUrl;
        preview.load();
      }

      function stopPreview() {
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = null;
        if (previewCard) {
          const preview = previewCard.querySelector('.preview-video');
          if (preview) {
            preview.pause();
            preview.classList.remove('active');
            preview.onloadedmetadata = null;
            preview.onplaying = null;
            preview.onerror = null;
            preview.removeAttribute('src');
            preview.load();
          }
        }
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewCard = null;
        previewUrl = null;
      }

      async function restoreLegacyFolders(epoch) {
        if (!('showDirectoryPicker' in window)) return;
        try {
          let saved = await dbGet('settings', 'directoryHandles');
          if (!Array.isArray(saved) || !saved.length) {
            const oldHandle = await dbGet('settings', 'directoryHandle');
            saved = oldHandle ? [{ handle: oldHandle, name: oldHandle.name }] : [];
          }
          if (epoch !== viewEpoch) return;
          directorySources = saved
            .map((item, index) => item?.handle
              ? {
                  id: item.id || crypto.randomUUID?.() || `saved-${index}-${Date.now()}`,
                  name: item.name || item.handle.name,
                  kind: 'handle',
                  handle: item.handle,
                  pending: true
                }
              : item?.queryPermission
                ? {
                    id: crypto.randomUUID?.() || `saved-${index}-${Date.now()}`,
                    name: item.name,
                    kind: 'handle',
                    handle: item,
                    pending: true
                  }
                : null)
            .filter(Boolean);
          if (!directorySources.length) return;
          updateSourceDisplay();
          await persistHandles();
          if (epoch === viewEpoch) await scanSources(false);
        } catch (_) {}
      }

      async function restoreFolders() {
        if (appliedHash === location.hash) return;
        const expectedHash = location.hash;
        const revision = ++urlRevision;
        appliedHash = expectedHash;
        let folders = null, tags;
        try {
          ({ folders, tags } = await ListUrlCodec.decodeHash(expectedHash));
          if (revision !== urlRevision || location.hash !== expectedHash) return;
        } catch (error) {
          if (revision !== urlRevision || location.hash !== expectedHash) return;
          resetFolderView();
          folderView = null;
          viewRoot = null;
          tagTypes = [];
          folderStateInitialized = false;
          urlError = true;
          renderTagTypes();
          updateSourceDisplay();
          setBusy(false);
          setHeaderCollapsed(false);
          showNotice(error?.code === 'URL_COMPRESSION_UNAVAILABLE' ? error.message : 'URLのフォルダ・タグ情報が壊れているか、未対応の形式です。元のURLを確認するか、#以降を削除して開き直してください。');
          return;
        }
        const token = folders === null ? null : FolderUrlCodec.encode(folders);
        const onlyTagsChanged = folderStateInitialized && !urlError && token === (folderView?.token ?? null);
        tagTypes = tags;
        renderTagTypes();
        void compactFolderHash(folders, [...tags], revision, expectedHash);
        if (onlyTagsChanged) return;
        resetFolderView();
        const epoch = viewEpoch;
        folderView = folders === null ? null : { folders, token };
        viewRoot = null;
        viewStorageWarning = '';
        urlError = false;
        folderStateInitialized = true;
        renderTagTypes();
        updateSourceDisplay();
        setBusy(true);
        if (folders === null) {
          await restoreLegacyFolders(epoch);
          if (epoch === viewEpoch) { updateSourceDisplay(); setBusy(false); }
          return;
        }
        let saved;
        try { saved = await dbGet('settings', `folderView:${token}`); } catch (_) {}
        if (epoch !== viewEpoch) return;
        if (saved?.handle?.kind === 'directory' && typeof saved.handle.queryPermission === 'function') {
          viewRoot = { handle: saved.handle, name: saved.name || saved.handle.name, cacheId: saved.cacheId || crypto.randomUUID() };
        }
        await scanSources(false);
      }

      // Local scope prevents the same relative path in different base folders sharing tags.
      function videoTagPath(video) {
        const source = directorySources.find(source => source.id === video.sourceId);
        const prefix = viewRoot ? source?.relativeRoot : source?.name;
        if (typeof prefix !== 'string') throw new Error('動画のフォルダ情報を確認できません。');
        return FolderUrlCodec.normalize([`${prefix}/${video.relativePath}`])[0];
      }

      function videoTagKey(video) {
        return JSON.stringify([viewRoot?.cacheId || `source:${video.sourceId}`, videoTagPath(video)]);
      }

      function activeVideoTags(video) {
        return (videoTagAssignments.get(videoTagKey(video)) || []).filter(tag => tagTypes.includes(tag));
      }

      function groupedTags() {
        const groups = [], categories = new Map();
        tagTypes.forEach((name, index) => {
          const separator = name.search(/[:：]/);
          const category = separator > 0 ? name.slice(0, separator).trim() : '';
          const label = separator > 0 ? name.slice(separator + 1).trim() : '';
          const item = { name, index, label: category && label ? label : name };
          if (!category || !label) { groups.push({ category: null, items: [item] }); return; }
          if (!categories.has(category)) { const group = { category, items: [] }; categories.set(category, group); groups.push(group); }
          categories.get(category).items.push(item);
        });
        return groups;
      }

      function groupedTagChoices(selected, kind) {
        const html = groupedTags().map((group, groupIndex) => {
          const choices = group.items.map(item => `<label class="tag-chip" data-chip-tag="${item.index}" title="${escapeHtml(item.name)}"><input type="checkbox" data-${kind}-tag="${item.index}" ${selected.has(item.name) ? 'checked' : ''} ${urlError ? 'disabled' : ''}><span>${escapeHtml(item.label)}</span></label>`).join('');
          if (!group.category) return choices;
          const open = !collapsedTagGroups[kind].get(group.category);
          return `<section class="tag-choice-group" data-chip-group="${groupIndex}"><div class="tag-choice-heading"><input type="checkbox" data-${kind}-category="${groupIndex}" ${urlError ? 'disabled' : ''} title="検索で隠れた項目も含め、このカテゴリ全体を選択・解除" aria-label="${escapeHtml(group.category)}のタグをすべて選択"><button class="tag-choice-toggle" type="button" data-collapse-group="${groupIndex}" aria-expanded="${open}" aria-controls="${kind}-tag-group-${groupIndex}"><span class="tag-choice-name">${escapeHtml(group.category)}</span><span class="tag-choice-count" data-group-count="${groupIndex}"></span></button></div><div class="tag-choice-items" id="${kind}-tag-group-${groupIndex}" ${open ? '' : 'hidden'}>${choices}</div></section>`;
        }).join('');
        return html + '<p class="tag-message tag-choice-empty" role="status" hidden>一致するタグがありません。</p>';
      }

      function applyTagChoiceSearch(container, kind) {
        const term = $(`#${kind}TagSearch`).value.trim().toLocaleLowerCase('ja');
        let visible = 0;
        container.querySelectorAll('[data-chip-tag]').forEach(chip => {
          const name = tagTypes[Number(chip.dataset.chipTag)] || '';
          chip.hidden = !name.toLocaleLowerCase('ja').includes(term);
          if (!chip.hidden) visible++;
        });
        const groups = groupedTags();
        container.querySelectorAll('[data-chip-group]').forEach(section => {
          const index = Number(section.dataset.chipGroup);
          section.hidden = ![...section.querySelectorAll('[data-chip-tag]')].some(chip => !chip.hidden);
          const open = Boolean(term) || !collapsedTagGroups[kind].get(groups[index].category);
          section.querySelector('.tag-choice-items').hidden = !open;
          section.querySelector('.tag-choice-toggle').setAttribute('aria-expanded', String(open));
        });
        const empty = container.querySelector('.tag-choice-empty');
        if (empty) empty.hidden = visible > 0;
      }

      function setupTagChoiceBrowser(container, kind) {
        $(`#${kind}TagSearch`).addEventListener('input', () => applyTagChoiceSearch(container, kind));
        container.addEventListener('click', event => {
          const button = event.target.closest('[data-collapse-group]');
          if (!button) return;
          const index = Number(button.dataset.collapseGroup);
          const open = button.getAttribute('aria-expanded') !== 'true';
          if (!$(`#${kind}TagSearch`).value.trim()) collapsedTagGroups[kind].set(groupedTags()[index].category, !open);
          button.setAttribute('aria-expanded', String(open));
          button.closest('[data-chip-group]').querySelector('.tag-choice-items').hidden = !open;
        });
      }

      function syncGroupedTagChecks(container, kind, selected) {
        const groups = groupedTags();
        container.querySelectorAll(`[data-${kind}-tag]`).forEach(input => {
          input.checked = selected.has(tagTypes[Number(input.dataset[`${kind}Tag`])]);
        });
        container.querySelectorAll(`[data-${kind}-category]`).forEach(input => {
          const group = groups[Number(input.dataset[`${kind}Category`])];
          const count = group.items.filter(item => selected.has(item.name)).length;
          input.checked = count === group.items.length;
          input.indeterminate = count > 0 && count < group.items.length;
          const countLabel = container.querySelector(`[data-group-count="${input.dataset[`${kind}Category`]}" ]`);
          if (countLabel) countLabel.textContent = count ? `${count} / ${group.items.length} 選択` : `${group.items.length}件`;
        });
      }

      function tagsForCheckbox(input, kind) {
        const categoryIndex = input.dataset[`${kind}Category`];
        if (categoryIndex !== undefined) return groupedTags()[Number(categoryIndex)]?.items.map(item => item.name) || [];
        const tag = tagTypes[Number(input.dataset[`${kind}Tag`])];
        return tag ? [tag] : [];
      }

      function matchesVideoFilters(video) {
        const term = elements.search.value.trim().toLocaleLowerCase('ja');
        const sourceId = $('#folderFilter').value;
        if (sourceId && video.sourceId !== sourceId) return false;
        const tags = activeVideoTags(video);
        if (term && !video.name.toLocaleLowerCase('ja').includes(term) &&
            !tags.some(tag => tag.toLocaleLowerCase('ja').includes(term))) return false;
        if (!selectedTagFilters.size) return true;
        // Reuse the UI groups: standalone tags are individual groups too.
        return groupedTags().every(group => {
          const selected = group.items.filter(item => selectedTagFilters.has(item.name));
          return !selected.length || selected.some(item => tags.includes(item.name));
        });
      }

      function updateTagFilterSummary() {
        const count = selectedTagFilters.size;
        $('#tagFilterLabel').textContent = 'タグ';
        $('#tagFilter').classList.toggle('active', count > 0);
        $('#tagFilterSummary').title = count ? [...selectedTagFilters].join('・') : 'タグの絞り込みと管理';
        $('#tagFilterSummary').setAttribute('aria-label', count ? `タグの絞り込みと管理：${count}個選択中` : 'タグの絞り込みと管理：指定なし');
        $('#clearTagFilter').disabled = !count;
      }

      function renderTagFilter() {
        for (const tag of selectedTagFilters) if (!tagTypes.includes(tag)) selectedTagFilters.delete(tag);
        $('#tagFilterChoices').innerHTML = tagTypes.length ? groupedTagChoices(selectedTagFilters, 'filter') : '<p class="tag-message">「管理」からタグの種類を登録してください。</p>';
        syncGroupedTagChecks($('#tagFilterChoices'), 'filter', selectedTagFilters);
        applyTagChoiceSearch($('#tagFilterChoices'), 'filter');
        updateTagFilterSummary();

      setupTagChoiceBrowser($('#tagFilterChoices'), 'filter');
      setupTagChoiceBrowser($('#videoTagChoices'), 'video');
      $('#tagFilterChoices').addEventListener('change', event => {
        const input = event.target.closest('[data-filter-tag], [data-filter-category]');
        if (!input || urlError) return;
        const tags = tagsForCheckbox(input, 'filter');

        syncGroupedTagChecks($('#tagFilterChoices'), 'filter', selectedTagFilters);
        updateTagFilterSummary();

      $('#clearTagFilter').addEventListener('click', () => {

      $('#tagFilter').addEventListener('keydown', event => {

      });
      document.addEventListener('click', event => {

      function refreshVideoTagLabels() {
        const visible = new Set(displayedVideos);
        const matching = allVideos.filter(matchesVideoFilters);
        if (matching.length !== displayedVideos.length || matching.some(video => !visible.has(video))) { render(); return; }

        elements.grid.querySelectorAll('.card').forEach(card => {
          const video = displayedVideos[Number(card.dataset.index)];
          if (!video) return;
          const label = card.querySelector('.video-tags-label');
          if (label) { label.textContent = activeVideoTags(video).join('・'); label.title = label.textContent; }
        });
      }

      async function loadVideoTags() {
        try {
          const saved = await dbGet('settings', 'videoTagAssignments.v1');
          if (saved !== undefined) {
            if (!Array.isArray(saved)) throw new Error('保存形式が不正です。');
            const validated = new Map();
            for (const entry of saved) {
              if (!Array.isArray(entry) || entry.length !== 2 || typeof entry[0] !== 'string') throw new Error('保存形式が不正です。');
              const key = JSON.parse(entry[0]);
              if (!Array.isArray(key) || key.length !== 2 || key.some(part => typeof part !== 'string')) throw new Error('保存形式が不正です。');
              validated.set(entry[0], TagUrlCodec.normalize(entry[1]));
            }
            videoTagAssignments = validated;
          }
        } catch (_) {
          // Avoid overwriting an existing database that could not be read.
          videoTagsWritable = false;
          $('#tagTransferMessage').textContent = '保存済みの割り当てを読み込めません。今回は一時保存になります。必要な変更は書き出してください。';
        } finally { videoTagsReady = true; refreshVideoTagLabels(); }
      }

      function saveVideoTags(changes) {
        const snapshot = [...changes].map(([key, tags]) => [key, [...tags]]);
        const operation = videoTagsSaveQueue.catch(() => {}).then(async () => {
          if (!videoTagsWritable) throw new Error('一時保存');
          const db = await openDatabase();
          // Merge only changed videos in one transaction so other tabs/lists survive.
          await new Promise((resolve, reject) => {
            const transaction = db.transaction('settings', 'readwrite');
            const store = transaction.objectStore('settings');
            const request = store.get('videoTagAssignments.v1');
            request.onsuccess = () => {
              try {
                const merged = new Map(request.result || []);
                for (const [key, tags] of snapshot) {
                  if (tags.length) merged.set(key, tags); else merged.delete(key);
                }
                store.put([...merged], 'videoTagAssignments.v1');
              } catch (_) { transaction.abort(); }
            };
            transaction.oncomplete = () => { db.close(); resolve(); };
            transaction.onerror = transaction.onabort = () => { db.close(); reject(new Error('ブラウザ内への保存に失敗しました')); };
          });
        });
        videoTagsSaveQueue = operation;
        return operation;
      }

      function openVideoTags(video) {
        if (!videoTagsReady || !video) return;
        stopPreview();
        editingTagVideo = video;
        $('#videoTagSearch').value = '';
        $('#videoTagTitle').textContent = video.path;
        renderVideoTagChoices();
        $('#videoTagMessage').textContent = videoTagsWritable ? '変更は自動で保存されます。' : '一時保存です。タグの管理から割り当てを書き出してください。';
        $('#videoTagDialog').showModal();
      }

      function renderVideoTagChoices() {
        if (!editingTagVideo) return;
        const selected = new Set(activeVideoTags(editingTagVideo));
        $('#videoTagChoices').innerHTML = tagTypes.length ? groupedTagChoices(selected, 'video') : '<p class="tag-message">ヘッダーの「タグ」→「管理」から、先にタグの種類を登録してください。</p>';
        syncGroupedTagChecks($('#videoTagChoices'), 'video', selected);
        applyTagChoiceSearch($('#videoTagChoices'), 'video');
      }

      function parseVideoTagsImport(value) {
        if (!value || value.format !== 'localflix-video-tags' || value.version !== 1 || !Array.isArray(value.videos) || value.videos.length > 100000) throw new Error('対応するLocal Video Browserの割り当てファイルではありません。');
        const types = TagUrlCodec.normalize(value.tagTypes);
        const entries = new Map();
        for (const item of value.videos) {
          if (!item || typeof item.path !== 'string') throw new Error('動画のパスが不正です。');
          const path = FolderUrlCodec.normalize([item.path])[0];
          if (path === '.' || entries.has(path)) throw new Error('動画のパスが重複しているか不正です。');
          const tags = TagUrlCodec.normalize(item.tags);
          if (tags.some(tag => !types.includes(tag))) throw new Error('未定義のタグが含まれています。');
          entries.set(path, tags);
        }
        return { types, entries };
      }

      function prepareVideoTagsImport(value) {
        const parsed = parseVideoTagsImport(value);
        const types = TagUrlCodec.normalize([...new Set([...tagTypes, ...parsed.types])]);
        const available = new Map();
        for (const video of allVideos) {
          const path = videoTagPath(video);
          if (!available.has(path)) available.set(path, new Set());
          available.get(path).add(videoTagKey(video));
        }
        const updates = new Map();
        let skipped = 0;
        for (const [path, tags] of parsed.entries) {
          const keys = available.get(path);
          if (!keys || keys.size !== 1) { skipped++; continue; }
          const key = [...keys][0];
          updates.set(key, [...new Set([...(videoTagAssignments.get(key) || []), ...tags])].sort());
          if (updates.get(key).length > 100) throw new Error('1本の動画のタグが100個を超えます。');
        }
        return { types, updates, skipped };
      }

      function exportVideoTagsData() {
        const paths = new Map();
        for (const video of allVideos) {
          const path = videoTagPath(video), key = videoTagKey(video);
          if (paths.has(path) && paths.get(path).key !== key) throw new Error('同名の対象フォルダがあるためパスを区別できません。基準フォルダを設定してから書き出してください。');
          paths.set(path, { key, tags: activeVideoTags(video) });
        }
        return { format: 'localflix-video-tags', version: 1, tagTypes: [...tagTypes], videos: [...paths].filter(([, item]) => item.tags.length).map(([path, item]) => ({ path, tags: item.tags })) };
      }

      function closeDialogOnOutsideClick(dialog) {
        let startedOutside = false;
        const outside = event => {
          const bounds = dialog.getBoundingClientRect();
          return event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom;
        };
        dialog.addEventListener('pointerdown', event => {
          startedOutside = event.isPrimary && event.button === 0 && event.target === dialog && outside(event);
        });
        dialog.addEventListener('pointercancel', () => { startedOutside = false; });
        dialog.addEventListener('click', event => {
          if (startedOutside && event.target === dialog && outside(event)) dialog.close();
          startedOutside = false;
        });
        dialog.addEventListener('close', () => { startedOutside = false; });
      }
      closeDialogOnOutsideClick($('#videoTagDialog'));
      closeDialogOnOutsideClick($('#tagDialog'));

      $('#closeVideoTagDialog').addEventListener('click', () => $('#videoTagDialog').close());
      $('#videoTagDialog').addEventListener('close', () => { editingTagVideo = null; });
      $('#videoTagChoices').addEventListener('change', async event => {
        const input = event.target.closest('[data-video-tag], [data-video-category]');
        if (!input || !editingTagVideo || urlError) return;
        const video = editingTagVideo, key = videoTagKey(video), changed = tagsForCheckbox(input, 'video');
        if (!changed.length) return;
        const tags = new Set(videoTagAssignments.get(key) || []);
        for (const tag of changed) { if (input.checked) tags.add(tag); else tags.delete(tag); }
        if (tags.size > 100) { syncGroupedTagChecks($('#videoTagChoices'), 'video', new Set(activeVideoTags(video))); $('#videoTagMessage').textContent = '1本の動画に保存できるタグは100個までです。'; return; }
        if (tags.size) videoTagAssignments.set(key, [...tags].sort()); else videoTagAssignments.delete(key);
        syncGroupedTagChecks($('#videoTagChoices'), 'video', tags);
        refreshVideoTagLabels();
        $('#videoTagMessage').textContent = '保存中…';
        try { await saveVideoTags(new Map([[key, [...tags]]])); if (editingTagVideo === video) $('#videoTagMessage').textContent = '保存しました。'; }
        catch (_) {
          const message = 'タグの保存に失敗しました。変更はこのページを開いている間のみ保持します。タグの管理から書き出してください。';
          if (editingTagVideo === video) $('#videoTagMessage').textContent = message; else showNotice(message);
        }
      });
      $('#exportVideoTags').addEventListener('click', () => {
        if (!videoTagsReady || folderBusy || urlError) { $('#tagTransferMessage').textContent = '一覧の読み込みが終わってからお試しください。'; return; }
        try {
          const data = exportVideoTagsData();
          const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
          const link = document.createElement('a');
          link.href = url; link.download = 'local-video-browser-tags.json'; document.body.append(link); link.click(); link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          $('#tagTransferMessage').textContent = `現在の一覧の${data.videos.length}本分を書き出しました。`;
        } catch (error) { $('#tagTransferMessage').textContent = error.message; }
      });
      $('#importVideoTags').addEventListener('click', () => {
        if (!videoTagsReady || folderBusy || urlError) { $('#tagTransferMessage').textContent = '一覧の読み込みが終わってからお試しください。'; return; }
        $('#videoTagsFile').value = ''; $('#videoTagsFile').click();
      });
      $('#videoTagsFile').addEventListener('change', async () => {
        const file = $('#videoTagsFile').files[0];
        if (!file || !videoTagsReady || folderBusy || urlError) return;
        const epoch = viewEpoch;
        try {
          if (file.size > 10 * 1024 * 1024) throw new Error('10MB以下のJSONファイルを選んでください。');
          const value = JSON.parse(await file.text());
          if (epoch !== viewEpoch || folderBusy || urlError) throw new Error('一覧が変更されました。もう一度読み込んでください。');
          const result = prepareVideoTagsImport(value);
          changeTagTypes(result.types);
          for (const [key, tags] of result.updates) if (tags.length) videoTagAssignments.set(key, tags);
          refreshVideoTagLabels();
          await saveVideoTags(result.updates);
          $('#tagTransferMessage').textContent = `${result.updates.size}本に取り込みました。対象外・区別できないパス：${result.skipped}本。`;
        } catch (error) { $('#tagTransferMessage').textContent = `読み込みまたは保存できませんでした：${error.message}。保存に失敗した場合は書き出して保管してください。`; }
      });

      function renderTagTypes() {
        renderTagFilter();
        $('#tagButton').disabled = urlError;
        $('#tagForm').querySelectorAll('input, button').forEach(node => { node.disabled = urlError; });
        $('#tagButton').title = `タグの管理（${tagTypes.length}個）`;
        $('#tagList').innerHTML = tagTypes.length ? groupedTags().map(group => {
          const items = group.items.map(item => `<span class="source-chip" title="${escapeHtml(item.name)}"><span>${escapeHtml(item.label)}</span><button class="remove-source" type="button" data-remove-tag="${item.index}" aria-label="${escapeHtml(item.name)}を削除">✕</button></span>`).join('');
          return group.category ? `<fieldset class="tag-category"><legend>${escapeHtml(group.category)}</legend><div class="tag-category-items">${items}</div></fieldset>` : items;
        }).join('') : '<p class="tag-message">タグはまだ登録されていません。</p>';
        $('#tagMessage').textContent = '';
        refreshVideoTagLabels();
        if (editingTagVideo) renderVideoTagChoices();
      }

      function changeTagTypes(tags) {
        if (urlError) return;
        tagTypes = TagUrlCodec.normalize(tags);
        writeFolderHash(folderView?.token ?? null);
        renderTagTypes();
      }

      $('#tagButton').addEventListener('click', () => {
        $('#tagFilter').open = false;
        $('#tagDialog').showModal();
        $('#tagName').focus();
      });
      $('#closeTagDialog').addEventListener('click', () => $('#tagDialog').close());
      $('#tagDialog').addEventListener('close', () => $('#tagFilterSummary').focus());
      $('#tagForm').addEventListener('submit', event => {
        event.preventDefault();
        if (urlError) return;
        try {
          const name = TagUrlCodec.normalize([$('#tagName').value])[0];
          if (tagTypes.includes(name)) throw new Error('同じ名前のタグは登録済みです。');

      });
      $('#tagList').addEventListener('click', event => {
        const button = event.target.closest('[data-remove-tag]');
        if (!button || urlError) return;

        const name = tagTypes[index];

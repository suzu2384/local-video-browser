  <style>
    :root {
      --bg: #080b12;
      --panel: #101621;
      --panel-2: #171e2b;
      --line: rgba(255,255,255,.1);
      --text: #f7f8fb;
      --muted: #9ba6b7;
      --accent: #147ac9;
      --accent-2: #43a5ff;
      --shadow: 0 18px 55px rgba(0,0,0,.45);
      --scene-width: 150px;
    }
    * { box-sizing: border-box; }
    html { scrollbar-gutter: stable; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);

        radial-gradient(circle at 90% 10%, rgba(72,91,154,.13), transparent 30rem),

    .button.primary { border-color: transparent; background: var(--accent); font-weight: 700; }
    .button.primary:hover { background: var(--accent-2); }
    .icon-button { width: 42px; padding: 0; font-size: 19px; }
    main { padding: 22px clamp(18px, 4vw, 56px) 64px; }
    .toolbar {

      min-width: 0;

      gap: 10px;

    .toolbar[hidden] { display: none; }

    .sort-direction:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
    .control {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--text);

    input.control { padding: 0 15px; }

    .topbar { display: block; padding: 0; }
    .topbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 72px; padding: 10px clamp(12px, 2vw, 28px); }

    .folder-summary { overflow: hidden; }

    .topbar .button { white-space: nowrap; }

    .header-toggle svg { width: 16px; height: 16px; transition: transform .15s; }

      background: transparent; backdrop-filter: none; overflow: visible;
    }
    .topbar.collapsed > :not(.header-toggle) { display: none; }
    .topbar.collapsed .header-toggle svg { transform: rotate(180deg); }
    .control:focus { border-color: rgba(22,142,245,.75); box-shadow: 0 0 0 3px rgba(22,142,245,.13); }

      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .summary:empty { display: none; }
    .grid {
      display: grid;
      align-content: start;
      align-items: start;
      grid-auto-rows: max-content;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px 16px;
      min-width: 0;
    }
    .content-layout.player-open {
      display: grid;
      grid-template-columns: minmax(0, var(--player-width, 57%)) 24px minmax(0, 1fr);
      align-items: start;
      gap: 0;
    }
    .split-handle { display: none; }
    @media (min-width: 1001px) {

        display: flex;
        position: sticky;
        top: calc(var(--header-height, 72px) + var(--content-top-gap, 22px));
        height: calc(100dvh - var(--header-height, 72px) - var(--content-top-gap, 22px) - 18px);
        min-height: 80px;
        align-items: center;
        justify-content: center;
        cursor: col-resize;
        touch-action: none;
        border-radius: 8px;
        outline-offset: -3px;
      }
      .split-handle::before {
        content: '';
        width: 4px;
        height: 64px;
        border-radius: 4px;
        background: #3d4656;
        transition: background .15s;
      }
      .split-handle:hover::before, .split-handle:focus-visible::before,
      .split-handle.dragging::before { background: var(--accent-2); }
    }
    body.resizing-split, body.resizing-split * { cursor: col-resize !important; user-select: none !important; }
    .content-layout.player-open .grid {
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    }
    .content-layout.player-open.theater-mode {
      display: block;
      position: static;
      grid-template-columns: 1fr;
      height: auto;
      padding: 0;
      overflow: visible;
      background: transparent;
    }
    .content-layout.player-open.theater-mode .grid {
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      grid-template-rows: none;
      grid-auto-flow: row;
      gap: 12px 16px;
      overflow: visible;
      padding: 0;
    }
    .card {
      min-width: 0;
      padding: 0;
      border: 0;
      text-align: left;
      background: transparent;
      cursor: pointer;
    }
    .poster {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: linear-gradient(135deg, #202a3b, #111722);
      box-shadow: 0 8px 26px rgba(0,0,0,.2);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover .poster, .card:focus-visible .poster {

      transform: scale(1.035);

    .card.selected .poster { border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(22,142,245,.3); }
    .thumb { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s ease; }
    .thumb { position: absolute; inset: 0; z-index: 1; }
    .thumb.ready { opacity: 1; }
    .preview-video {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      background: #000;
      transition: opacity .18s ease;
      pointer-events: none;
    }
    .preview-video.active { opacity: 1; }
    .duration-badge {

      background: rgba(0,0,0,.78);

      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      pointer-events: none;
    }
    .duration-badge:empty { display: none; }
    .card-scenes {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
      min-width: 0;
      margin: 7px 1px 0;
    }
    .card-scene {
      position: relative;
      display: block;
      overflow: hidden;
      width: 100%;
      min-width: 0;
      height: auto;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 5px;
      object-fit: cover;
      background: #151b25;
    }
    .card-scene > img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-scene.unavailable {
      display: grid;
      place-items: center;
      color: #7e8a9d;
      background: #151b25;
    }
    .card-scene.unavailable::before { content: '▧'; font-size: 18px; }
    .card-scene.loading {
      background: linear-gradient(100deg, #151b25 20%, #252d3a 38%, #151b25 58%);
      background-size: 220% 100%;
      animation: shimmer 1.2s linear infinite;
    }
    .fallback-art {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 75% 20%, hsla(var(--h),80%,70%,.35), transparent 37%),
        linear-gradient(145deg, hsl(var(--h),45%,25%), #111722 70%);
    }
    .fallback-art::before { content: "▶"; font-size: 34px; opacity: .77; filter: drop-shadow(0 3px 10px #000); }
    .play-badge {

      z-index: 3;
      left: 12px;
      bottom: 12px;

      width: 38px;
      height: 38px;

      background: rgba(255,255,255,.94);

      transform: translateY(4px);
      transition: .2s ease;
    }
    .card:hover .play-badge, .card:focus-visible .play-badge { opacity: 1; transform: none; }
    .card-title {
      overflow: hidden;
      margin: 6px 2px 2px;

      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notice {

      z-index: 30;

      color: #f8d89a;
      background: rgba(156,103,16,.13);
      line-height: 1.55;
    }
    .notice.show { display: block; }
    .sources {

      gap: 8px;

      max-height: 260px;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16,22,33,.98);
      box-shadow: var(--shadow);

    .sources:empty { display: none; }
    .source-setup { flex: 0 0 100%; font-size: 13px; line-height: 1.6; }
    .source-setup p { margin: 0 0 8px; overflow-wrap: anywhere; }
    .source-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .source-actions a { color: var(--text); text-decoration: none; }
    .source-chip { max-width: 100%; }
    .source-chip > span { min-width: 0; overflow-wrap: anywhere; }
    .notice { max-height: 40vh; overflow: auto; white-space: pre-line; }
    .source-chip {

      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 6px 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #dbe1eb;
      background: rgba(23,30,43,.9);
      font-size: 13px;
    }
    .source-chip.pending { border-color: rgba(255,192,84,.4); color: #f8d89a; }
    .remove-source {
      display: grid;
      width: 24px;
      height: 24px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .remove-source:hover { color: #fff; background: rgba(255,255,255,.1); }
    .player-pane {
      position: sticky;
      top: calc(var(--header-height, 72px) + var(--content-top-gap, 22px));
      scroll-margin-top: calc(var(--header-height, 72px) + var(--content-top-gap, 22px));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: var(--text);
      background: #06080d;
      box-shadow: var(--shadow);
    }
    .content-layout.player-open:not(.theater-mode) .player-pane {

      max-height: calc(100dvh - var(--header-height, 72px) - var(--content-top-gap, 22px) - 18px);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-color: #3d4656 transparent;

    .player-shell { position: relative; }
    .video-stage { position: relative; }

      transition: opacity .2s ease;
    }

    .video-stage.controls-hidden .close,
    .video-stage.controls-hidden .loop-toggle {
      opacity: 0;
      pointer-events: none;
    }
    .video-stage.controls-hidden button:focus-visible { opacity: 1; pointer-events: auto; }
    .loop-toggle {

      right: 62px;

      background: rgba(0,0,0,.72);

      object-fit: contain;
      background: #000;
    }

      height: auto;

    .theater-mode .player-shell {

      height: auto;
    }

      max-height: none;
    }
    .theater-mode .player-info {
      padding: 17px 20px 20px;
    }

    }
    .theater-mode .scenes {
      padding: 0 16px 16px;
    }
    .theater-mode .scenes-head {

    }
    .mode-toggle {
      position: absolute;
      z-index: 3;
      top: 12px;
      left: 12px;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.72);
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .mode-toggle:hover { background: rgba(30,30,30,.92); }
    .close {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
      color: #fff;
      background: rgba(0,0,0,.72);
      cursor: pointer;
    }
    .player-info { padding: 17px 20px 20px; }
    .player-info h2 { margin: 0 0 6px; font-size: 19px; }

      min-height: 43px;
    }
    .scenes-title { font-size: 13px; font-weight: 750; }
    .scenes-status { color: var(--muted); font-size: 11px; }
    .scene-strip {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 1px 1px 7px;
      scrollbar-color: #3d4656 transparent;
    }
    .content-layout.player-open:not(.theater-mode) .scene-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--scene-width));
      overflow: visible;
    }
    .content-layout.player-open:not(.theater-mode) .scene-card,
    .content-layout.player-open:not(.theater-mode) .scene-placeholder {
      width: var(--scene-width);
      min-width: var(--scene-width);
      flex: none;
    }
    .scene-card {
      position: relative;
      flex: 0 0 var(--scene-width);
      width: var(--scene-width);
      overflow: hidden;
      aspect-ratio: 16 / 9;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #151b25;
      cursor: pointer;
    }
    .scene-card:hover { border-color: var(--accent-2); transform: translateY(-1px); }
    .scene-card img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
    .scene-time {
      position: absolute;
      right: 5px;
      bottom: 5px;
      padding: 2px 5px;
      border-radius: 4px;
      color: #fff;
      background: rgba(0,0,0,.78);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    .scene-unavailable { flex: 0 0 var(--scene-width); width: var(--scene-width); aspect-ratio: 16 / 9; border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: 11px; background: #151b25; animation: none; }
    .scene-placeholder {
      flex: 0 0 var(--scene-width);
      width: var(--scene-width);
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      background: linear-gradient(100deg, #151b25 20%, #252d3a 38%, #151b25 58%);
      background-size: 220% 100%;
      animation: shimmer 1.2s linear infinite;
    }
    .folder-button-icon {
      position: relative;
      display: inline-grid;
      place-items: center;
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      line-height: 1;
    }
    .button.loading .folder-button-plus { visibility: hidden; }
    .button.loading .folder-button-icon::after {
      content: "";
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { to { background-position-x: -220%; } }
    @media (max-width: 1000px) {
      .content-layout.player-open { grid-template-columns: 1fr; gap: 24px; }
      .player-pane { position: relative; top: auto; }
      .player-video { max-height: 62vh; }
      .content-layout.player-open .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
    @media (max-width: 760px) {
      .topbar { gap: 10px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px 12px; }
      .button-label { display: none; }
    }
    .grid, .content-layout.player-open .grid, .content-layout.theater-mode .grid {
      grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--thumbnail-width, 224px)), 1fr));
    }
    .card-scenes { grid-template-columns: repeat(var(--mini-scene-count, 3), minmax(0, 1fr)); margin-left: 0; margin-right: 0; }
    .size-buttons { display: flex; gap: 3px; }
    .size-button { width: 36px; padding: 0; min-height: 44px; }
    .size-button svg { width: 24px; height: 24px; }
    .size-button[aria-pressed="true"] { color: #151b25; background: #e5e7eb; }
    #durationStatus { flex-shrink: 0; }
    .folder-summary { display: grid; grid-template-columns: 140px 130px minmax(0, 1fr); align-items: center; gap: 8px; line-height: 18px; }
    .folder-summary .summary { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .folder-summary .summary:empty { display: block; }
    .folder-summary #summary.summary-message { grid-column: 2 / -1; overflow: visible; text-overflow: clip; }
    .folder-summary #summary.summary-message ~ #durationStatus { display: none; }
    .folder-summary .folder-name { max-width: 100%; }
    .folder-summary .summary { padding-left: 0; border: 0; }
    .tag-dialog { width: min(420px, calc(100vw - 32px)); max-height: 80vh; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: #101621; color: var(--text); box-shadow: var(--shadow); }
    .tag-dialog::backdrop { background: rgba(0,0,0,.55); }
    .tag-dialog-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .tag-dialog h2 { margin: 0; font-size: 18px; }
    .tag-form { display: flex; gap: 8px; margin-top: 8px; }
    .tag-form input { flex: 1; min-width: 0; width: 0; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tag-message { font-size: 13px; color: var(--muted); margin: 8px 0; overflow-wrap: anywhere; }
    .card .poster { display: block; width: 100%; padding: 0; cursor: pointer; color: inherit; }
    .card:focus-within .play-badge { opacity: 1; transform: none; }
    .card-tags { display: flex; align-items: center; gap: 6px; padding: 0 2px 2px; min-width: 0; }
    .video-tags-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .edit-video-tags { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 6px; background: transparent; padding: 2px 6px; font-size: 11px; line-height: 1.3; cursor: pointer; }
    .video-tag-choices { display: grid; gap: 8px; margin: 12px 0; }
    .video-tag-choice { display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
    .video-tag-choice input { accent-color: #dbe1eb; }
    .tag-transfer { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    #videoTagTitle { overflow-wrap: anywhere; }
    .tag-filter { flex: 0 0 96px; width: 96px; }
    .tag-filter > summary { padding-left: 8px; padding-right: 8px; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; }
    .tag-filter > summary::-webkit-details-marker { display: none; }
    .tag-filter > summary::after { content: '▾'; }
    .tag-filter.active > summary { color: #151b25; border-color: #fff; background: #e5e7eb; box-shadow: 0 0 8px rgba(229,231,235,.16); }
    .tag-filter-panel { position: fixed; top: calc(var(--header-height, 72px) + 8px); right: 18px; width: min(320px, calc(100vw - 36px)); max-height: min(420px, 70vh); overflow: auto; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: #101621; box-shadow: var(--shadow); z-index: 30; }
    .tag-filter-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tag-filter-actions { display: flex; align-items: center; gap: 8px; }
    .tag-filter-heading strong { font-size: 14px; }
    .tag-filter-clear { background: transparent; border: 0; padding: 4px; color: var(--muted); cursor: pointer; font-size: 12px; }
    .tag-filter-clear:disabled { opacity: .4; cursor: default; }
    #tagFilterChoices { display: grid; gap: 10px; margin-top: 12px; }
    .tag-category { min-width: 0; margin: 0; padding: 8px 10px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .tag-category legend { max-width: 100%; padding: 0 4px; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
    .tag-category-items { display: grid; gap: 8px; padding-left: 16px; }
    #tagList { display: grid; }
    #tagList .tag-category-items { display: flex; flex-wrap: wrap; padding-left: 0; }
    @media (max-width: 1100px) {
      .topbar .source-menu { flex: 1 1 440px; }
      .header-actions { flex-basis: 100%; }
      #searchInput { max-width: none; }
    }
    @media (max-width: 600px) {
      .topbar-row { gap: 8px; padding: 8px 12px; }
      .topbar .brand { width: 148px; }
      .topbar .source-menu { flex: 1 1 180px; min-width: 0; }
      .folder-summary { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 8px; font-size: 11px; }
      .folder-summary #durationStatus { grid-column: 1 / -1; min-height: 18px; }
      .folder-summary #summary.summary-message { grid-column: 1 / -1; white-space: normal; overflow-wrap: anywhere; }
      .header-actions { gap: 6px; }
      #searchInput { flex: 1 1 100%; width: 100%; min-width: 0; }
      #folderFilter { flex: 1 1 120px; width: auto; min-width: 110px; }
      .sort-controls { flex: 1 1 150px; min-width: 140px; gap: 6px; }
      #thumbnailSize { gap: 3px; }
      #thumbnailSize .size-button { width: 32px; }
      .tag-filter { flex-basis: 80px; width: 80px; }
      .tag-filter > summary { gap: 4px; padding-left: 6px; padding-right: 6px; }
      .header-actions > .icon-button, #folderButton { width: 38px; padding-left: 0; padding-right: 0; }
      .folder-summary .summary { font-size: 11px; }
    }
    .sources, .tag-filter-panel { max-height: min(420px, max(100px, calc(100dvh - var(--header-height, 72px) - 24px))); }
    .tag-filter-panel { width: min(420px, calc(100vw - 36px)); }
    .tag-choice-search { margin-top: 8px; min-height: 38px; }
    #tagFilterChoices, #videoTagChoices { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 7px; }
    .tag-choice-group { flex: 0 0 100%; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    .tag-choice-heading { display: flex; align-items: center; gap: 8px; }
    .tag-choice-heading > input { accent-color: #e5e7eb; flex-shrink: 0; }
    .tag-choice-toggle { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; border: 0; padding: 2px 0; background: transparent; text-align: left; cursor: pointer; }
    .tag-choice-toggle::before { content: '▾'; flex-shrink: 0; }
    .tag-choice-toggle[aria-expanded="false"]::before { content: '▸'; }
    .tag-choice-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; font-size: 13px; }
    .tag-choice-count { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .tag-choice-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag-chip { position: relative; max-width: 100%; cursor: pointer; }
    .tag-chip > input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .tag-chip > span { display: block; border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; background: var(--panel-2); }
    .tag-chip > input:checked + span { background: #e5e7eb; color: #151b25; border-color: #fff; }
    .tag-chip > input:focus-visible + span, .tag-choice-toggle:focus-visible { outline: 2px solid #e5e7eb; outline-offset: 2px; }
    .tag-chip > input:disabled + span { opacity: .4; cursor: default; }
    .tag-chip[hidden], .tag-choice-group[hidden], .tag-choice-items[hidden], .tag-choice-empty[hidden] { display: none; }
  </style>

  <script id="folder-url-codec">
    const FolderUrlCodec = (() => {
      function normalize(paths) {
        if (!Array.isArray(paths) || paths.length > 256) throw new Error('対象フォルダの形式が不正です。');
        const normalized = paths.map(path => {
          if (typeof path !== 'string' || path.length > 4096 || /[\x00-\x1f\x7f:]/.test(path)) throw new Error('相対パスが不正です。');
          path = path.replace(/\\/g, '/');
          if (path.startsWith('/')) throw new Error('絶対パスは指定できません。');
          const parts = path.split('/');
          if (parts.includes('..')) throw new Error('基準フォルダの外は指定できません。');
          return parts.filter(part => part && part !== '.').join('/') || '.';
        });
        return [...new Set(normalized)].sort();
      }
      function encode(paths) {
        const bytes = new TextEncoder().encode(JSON.stringify({ v: 1, folders: normalize(paths) }));
        const token = btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        if (token.length > 65536) throw new Error('対象フォルダが多すぎます。一覧を分けてください。');
        return token;
      }
      function decode(token) {
        if (typeof token !== 'string' || token.length > 65536 || !/^[A-Za-z0-9_-]+$/.test(token) || token.length % 4 === 1) throw new Error('URLのフォルダ情報を読み取れません。');
        const binary = atob(token.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - token.length % 4) % 4));
        const value = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.from(binary, char => char.charCodeAt(0))));
        if (!value || value.v !== 1 || Object.keys(value).some(key => !['v', 'folders'].includes(key))) throw new Error('このURLの形式には対応していません。');
        return normalize(value.folders);
      }
      async function resolve(root, path) {
        const normalized = normalize([path])[0];
        let handle = root;
        if (normalized !== '.') for (const name of normalized.split('/')) handle = await handle.getDirectoryHandle(name);
        return handle;
      }
      return { normalize, encode, decode, resolve };
    })();
  </script>
  <script id="tag-url-codec">
    const TagUrlCodec = (() => {
      function normalize(tags) {
        if (!Array.isArray(tags) || tags.length > 100) throw new Error('タグは100個まで登録できます。');
        return [...new Set(tags.map(tag => {
          if (typeof tag !== 'string') throw new Error('タグ名が不正です。');
          const name = tag.trim().normalize('NFC');
          if (!name || name.length > 40 || /[\x00-\x1f\x7f]/.test(name)) throw new Error('タグ名は空白以外の1〜40文字で入力してください。');
          return name;
        }))].sort();
      }
      function encode(tags) {
        const bytes = new TextEncoder().encode(JSON.stringify({ v: 1, tags: normalize(tags) }));
        return btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      function decode(token) {
        if (typeof token !== 'string' || token.length > 32768 || !/^[A-Za-z0-9_-]+$/.test(token) || token.length % 4 === 1) throw new Error('タグ情報が不正です。');
        const binary = atob(token.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - token.length % 4) % 4));
        const value = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.from(binary, char => char.charCodeAt(0))));
        if (!value || value.v !== 1 || Object.keys(value).some(key => !['v', 'tags'].includes(key))) throw new Error('タグ情報が未対応の形式です。');
        return normalize(value.tags);
      }
      return { normalize, encode, decode };
    })();
  </script>
  <script id="list-url-codec">
    const ListUrlCodec = (() => {
      const MAX_HASH_LENGTH = 100000;
      const MAX_PAYLOAD_BYTES = 96 * 1024;

      function canonical(folders, tags) {
        const value = {
          folders: folders === null ? null : FolderUrlCodec.normalize(folders),
          tags: TagUrlCodec.normalize(tags)
        };
        // Keep the existing folder identity and its limits, independent of URL encoding.
        if (value.folders !== null) FolderUrlCodec.encode(value.folders);
        return value;
      }

      function legacyHash(folders, tags) {
        const params = new URLSearchParams();
        if (folders !== null) params.set('folders', FolderUrlCodec.encode(folders));
        if (tags.length) params.set('tags', TagUrlCodec.encode(tags));
        const query = params.toString();
        return query ? `#${query}` : '';
      }

      function toBase64(bytes) {
        return btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      function fromBase64(token) {
        if (!token || !/^[A-Za-z0-9_-]+$/.test(token) || token.length % 4 === 1) throw new Error('invalid base64');
        const binary = atob(token.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - token.length % 4) % 4));
        return Uint8Array.from(binary, char => char.charCodeAt(0));
      }

      async function transform(bytes, stream) {
        // Read with a bound rather than allocating an unbounded decompressed response.
        const reader = new Blob([bytes]).stream().pipeThrough(stream).getReader();
        const chunks = [];
        let length = 0;
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            length += value.byteLength;
            if (length > MAX_PAYLOAD_BYTES) throw new Error('URLの情報が大きすぎます。');
            chunks.push(value);
          }
        } catch (error) {
          await reader.cancel().catch(() => {});
          throw error;
        } finally { reader.releaseLock(); }
        const output = new Uint8Array(length);
        let offset = 0;
        for (const chunk of chunks) { output.set(chunk, offset); offset += chunk.byteLength; }
        return output;
      }

      async function encodeHash(folders, tags) {
        const value = canonical(folders, tags);
        let shortest = legacyHash(value.folders, value.tags);
        if (!shortest) return '';
        // A compact tuple avoids repeated JSON field names; deflate deduplicates prefixes.
        const bytes = new TextEncoder().encode(JSON.stringify([1, value.folders, value.tags]));
        const plain = `#list=j.${toBase64(bytes)}`;
        if (plain.length < shortest.length) shortest = plain;
        if (typeof CompressionStream === 'function' && typeof DecompressionStream === 'function') {
          try {
            const compressed = await transform(bytes, new CompressionStream('deflate'));
            const hash = `#list=z.${toBase64(compressed)}`;
            if (hash.length < shortest.length) shortest = hash;
          } catch (_) { /* The plain/legacy form works when compression is unavailable. */ }
        }
        return shortest;
      }

      async function decodeHash(hash) {
        if (typeof hash !== 'string' || hash.length > MAX_HASH_LENGTH) throw new Error('invalid URL length');
        const params = new URLSearchParams(hash.replace(/^#/, ''));
        if (params.has('list')) {
          if ([...params].length !== 1) throw new Error('mixed URL formats');
          const match = /^([jz])\.([A-Za-z0-9_-]+)$/.exec(params.get('list'));
          if (!match) throw new Error('unknown URL format');
          let bytes = fromBase64(match[2]);
          if (match[1] === 'z') {
            if (typeof DecompressionStream !== 'function') {
              const error = new Error('この圧縮URLを開くには、圧縮の読み込みに対応した新しいChrome / Edgeを使用してください。');
              error.code = 'URL_COMPRESSION_UNAVAILABLE';
              throw error;
            }
            bytes = await transform(bytes, new DecompressionStream('deflate'));
          }
          if (bytes.byteLength > MAX_PAYLOAD_BYTES) throw new Error('URL payload too large');
          const value = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
          if (!Array.isArray(value) || value.length !== 3 || value[0] !== 1) throw new Error('unknown URL version');
          return canonical(value[1], value[2]);
        }
        if (params.getAll('folders').length > 1 || params.getAll('tags').length > 1 || [...params.keys()].some(key => !['folders', 'tags'].includes(key))) throw new Error('invalid legacy URL');
        return canonical(params.has('folders') ? FolderUrlCodec.decode(params.get('folders')) : null,
          params.has('tags') ? TagUrlCodec.decode(params.get('tags')) : []);
      }

      return { legacyHash, encodeHash, decodeHash };
    })();
  </script>

      }

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes) || bytes < 1) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        const value = bytes / (1024 ** index);
        return `${value.toFixed(index > 1 ? 1 : 0)} ${units[index]}`;
      }

      function formatTime(seconds) {
        const total = Math.max(0, Math.floor(seconds || 0));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = total % 60;
        return hours
          ? `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
          : `${minutes}:${String(secs).padStart(2, '0')}`;
